name: Generador de Videos Salud Mental

on:
  workflow_dispatch:

jobs:
  build-and-send:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependencias
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          pip install requests

      - name: Generar contenido e imágenes con Cloudflare AI
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: |
          echo "Generando imágenes y script con Cloudflare Workers AI..."

      - name: Generar audio con Piper TTS
        run: |
          echo "Generando voz en off..."

      - name: Ensamblar Video
        run: |
          echo "Ensamblando video en formato 9:16..."

      - name: Enviar video a Telegram
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendVideo" \
            -F chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -F video="@output_video.mp4" \
            -F caption="🎬 ¡Tu nuevo video de Salud Mental está listo!"
